# Versions publiées de Librix Mail (lot G5b). Mode d'emploi : docs/CI.md, § 6.
#
# Sur étiquette v* (ou à la main, sans publication) :
# - versions identiques partout (étiquette, tauri.conf.json, Cargo.toml, package.json) ;
# - dépendances (cargo deny) et tests Rust repassés sur le code étiqueté (lot J8c,
#   audit) : aucun installateur n'est construit s'ils échouent ;
# - installateurs Linux (deb, AppImage, Flatpak) et Windows (NSIS, version portable) ;
# - snap envoyé au canal edge du Snap Store (passage en stable à la main) ;
# - Windows signé par SignPath (certificat de la SignPath Foundation) si le
#   projet SignPath est configuré ; chaque signature est approuvée à la main ;
# - empreintes SHA256SUMS, signées par GPG si la clé est fournie ;
# - version GitHub créée en brouillon : relue, puis publiée à la main.
#
# L'audit complet de chaque envoi reste fait par Jenkins (Jenkinsfile).
name: Version publiée

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: check
        name: Même version partout
        shell: bash
        run: |
          app=$(jq -r .version src-tauri/tauri.conf.json)
          npm=$(jq -r .version package.json)
          crate=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tauri.conf.json $app, package.json $npm, Cargo.toml $crate"
          if [ "$app" != "$npm" ] || [ "$app" != "$crate" ]; then
            echo "::error::Versions différentes : tauri.conf.json $app, package.json $npm, Cargo.toml $crate"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$app" ]; then
            echo "::error::L'étiquette $GITHUB_REF_NAME ne correspond pas à la version $app"
            exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"
      # Copie de l'ISPDB de Thunderbird (lot I1) : rafraîchie avant l'étiquette par
      # `make ispdb`, jamais pendant la construction (le code publié doit être celui construit).
      - name: Copie de l'ISPDB récente
        run: python3 scripts/ispdb.py age 60

  # Lot J8c : l'étiquette peut viser un commit que Jenkins n'a pas audité
  # (poussé seulement sur GitHub) ; ces deux contrôles ne coûtent que quelques minutes.
  tests:
    name: Dépendances et tests
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Bibliothèques du système
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev
      - name: Rust (version de rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo-deny
        run: cargo install --locked cargo-deny
      - name: Dépendances (avis acceptés de deny.toml)
        run: make deny
      # dist/ est embarqué par tauri::generate_context!, même pour les tests.
      - run: npm ci
      - run: npm run build
      - name: Tests Rust
        run: make test

  linux:
    name: Linux
    needs: [version, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Bibliothèques du système
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev
      - name: Rust (version de rust-toolchain.toml)
        run: rustup toolchain install
      - run: npm ci
      - run: npm run tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Lot PK2 : fichier .flatpak (packaging/flatpak/README.md), construit comme
  # `make flatpak` sur le PC : sources cargo et npm déclarées à l'avance,
  # compilation sans réseau dans le socle GNOME.
  flatpak:
    name: Flatpak
    needs: [version, tests]
    runs-on: ubuntu-24.04
    env:
      # Commit de flatpak-builder-tools (générateurs des sources), changé à la main.
      FLATPAK_BUILDER_TOOLS: 9d86d336a39b9af38b86f114b6ce5820fe260f91
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Outils Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream python3-aiohttp python3-tomlkit pipx
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          git clone --quiet https://github.com/flatpak/flatpak-builder-tools "$HOME/outils/flatpak-builder-tools"
          git -C "$HOME/outils/flatpak-builder-tools" checkout --quiet "$FLATPAK_BUILDER_TOOLS"
          pipx install "$HOME/outils/flatpak-builder-tools/node"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Construction
        run: make flatpak
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flatpak
          path: target/Librix.Mail_x86_64.flatpak
          if-no-files-found: error

  # Lot PK3 : snap (packaging/snap/README.md), construit dans LXD comme
  # `make snap`, envoyé au canal edge du Snap Store sur étiquette si le secret
  # SNAPCRAFT_STORE_CREDENTIALS est fourni (snapcraft export-login).
  snap:
    name: Snap
    needs: [version, tests]
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: LXD et snapcraft
        run: |
          sudo snap install lxd
          sudo lxd waitready
          sudo lxd init --auto
          # Docker met la politique FORWARD à DROP : sans ces règles, les
          # conteneurs LXD ne sortent pas en IPv4 (même réglage que sur le PC).
          sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
          sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          sudo snap install snapcraft --classic
      - name: Construction
        run: |
          mkdir -p target
          sudo snapcraft pack --use-lxd --output target/
          ls -l target/librixmail_*_amd64.snap
      - name: Envoi au canal edge du Snap Store
        if: ${{ github.ref_type == 'tag' && env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        run: snapcraft upload --release=edge target/librixmail_*_amd64.snap
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: snap
          path: target/librixmail_*_amd64.snap
          if-no-files-found: error

  windows:
    name: Windows
    needs: [version, tests]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      # Perl (Strawberry, présent sur l'image) compile OpenSSL pour SQLCipher (lot G4).
      - name: Rust (version de rust-toolchain.toml)
        run: rustup toolchain install
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - name: Version portable
        shell: pwsh
        run: .\scripts\portable.ps1
      - name: Fichiers à signer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force a-signer | Out-Null
          Copy-Item target\release\bundle\nsis\*.exe a-signer\
          Copy-Item target\LibrixMail-portable-*.zip a-signer\
      - id: unsigned
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-non-signe
          path: a-signer/
          if-no-files-found: error
      # Sans projet SignPath configuré (variables du dépôt), les fichiers partent non signés.
      - name: Signature par SignPath (approbation à la main)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signe
      - name: Fichiers livrés
        shell: pwsh
        run: |
          if (Test-Path signe) { Move-Item signe livre } else { Move-Item a-signer livre }
          Get-ChildItem livre
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows
          path: livre/
          if-no-files-found: error

  publication:
    name: Publication (brouillon)
    needs: [version, linux, windows, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: linux
          path: livraison
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: windows
          path: livraison
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: flatpak
          path: livraison
      # L'artefact linux garde ses sous-dossiers (deb/, appimage/) : tout remettre à plat.
      - name: Fichiers à plat
        run: |
          find livraison -mindepth 2 -type f -exec mv -t livraison {} +
          find livraison -mindepth 1 -type d -empty -delete
          # GitHub remplace les espaces des noms de fichiers par des points : faire de même avant SHA256SUMS.
          for f in livraison/*\ *; do [ -e "$f" ] && mv -- "$f" "${f// /.}"; done
          # Noms fixes, sans numéro de version : liens stables …/releases/latest/download/<nom>
          # pour la page Téléchargement du site (lot S1). Échoue si un nom attendu manque.
          mv -- livraison/Librix.Mail_*_amd64.deb livraison/Librix.Mail_amd64.deb
          mv -- livraison/Librix.Mail_*_amd64.AppImage livraison/Librix.Mail_amd64.AppImage
          mv -- livraison/Librix.Mail_*_x64-setup.exe livraison/Librix.Mail_x64-setup.exe
          mv -- livraison/LibrixMail-portable-*.zip livraison/Librix.Mail_x64-portable.zip
          ls -l livraison
      - name: Empreintes SHA256SUMS (signées si la clé GPG est fournie)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd livraison
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            export GNUPGHOME="$(mktemp -d)"
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign SHA256SUMS
            gpg --batch --verify SHA256SUMS.asc SHA256SUMS
            rm -rf "$GNUPGHOME"
          fi
      - name: Version GitHub en brouillon
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Librix Mail $VERSION" \
            --notes "Vérifier les fichiers : \`sha256sum -c SHA256SUMS\` (et \`gpg --verify SHA256SUMS.asc SHA256SUMS\` si la signature est jointe)." \
            livraison/*
      - if: ${{ github.ref_type != 'tag' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: livraison
          path: livraison/
